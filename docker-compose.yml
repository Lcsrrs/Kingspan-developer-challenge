services:
  db:
    image: postgres:16
    container_name: kingspan-db
    environment:
      POSTGRES_DB: kingspan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/challenge
      dockerfile: Dockerfile
    container_name: kingspan-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/kingspan_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: chave_secreta_com_mais_de_32_caracteres
      JWT_EXPIRATION: 86400000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kingspan-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: